<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mio Ogawa</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <a href="#top">Mio Ogawa</a>
            <nav>
                <a href="#about">About</a>
                <a href="#works">Works</a>
            </nav>
        </header>
        <main>
            <section id="top" class="hero">
                <img src="./portfolio.jpg" alt="夜景の写真" class="hero-image">
                
                <div class="hero-text">
                    <h1>
                        Mio Ogawa<br>
                        Portfolio
                    </h1>
                </div>
            </section>
            <section id="weather-section">
                <p id="weather-icon"> </p>

                <h3>About</h3>
                <p>
                     小川　美桜<br>

                </p>

                     出身：神奈川県川崎市<br>
                     生年月日：2006年04月19日
                </p>
            </section>

                <div class="works-controls">
                    <select id="category">
                        <option value="all">すべてのカテゴリ</option>
                    </select>
                    <select id="sort">
                        <option value="new">新しい順</option>
                        <option value="old">古い順</option>

                    </select>

        <footer>
